[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heatshield-agent"
version = "0.1.0"
description = "Autonomous heat-risk monitoring agent for outdoor and industrial crews (FortyGuard Hackathon '26, Track 6)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "apscheduler>=3.10",
    "python-dotenv>=1.0",
    "streamlit>=1.35",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "respx>=0.21",
]

[tool.setuptools]
packages = ["agent", "agent.act", "dashboard"]
